---
name: Release

on:
  push:
    branches:
      - main

env:
  REGISTRY: ${{ secrets.GCP_ARTIFACT_REGISTRY_URL }}
  IMAGE_NAME: caddy

jobs:
  Release:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v7

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.3.0

      - name: Collect build information
        run: |
          echo XCADDY_VERSION="$(go list -m -f '{{.Version}}' github.com/caddyserver/xcaddy)" >> "${GITHUB_ENV}"

      - name: Build container image
        uses: docker/build-push-action@v7.3.0
        with:
          push: false
          build-args: XCADDY_VERSION=${{ env.XCADDY_VERSION }}

      - name: Tag new version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
        run: |
          set -o xtrace
          git fetch --tags
          CADDY_VERSION="$(go list -m -f '{{.Version}}' github.com/caddyserver/caddy/v2)"
          MOST_RECENT_TAG="$(git describe --tags "$(git rev-list --tags --max-count=1)" 2> /dev/null || echo '0')"
          BUILD_NUMBER="$(echo "${MOST_RECENT_TAG}" | grep --perl-regexp --only-matching '\d+$')"
          BUILD_NUMBER="$((BUILD_NUMBER + 1))"
          TAG_NAME="${CADDY_VERSION}-${BUILD_NUMBER}"
          git tag "${TAG_NAME}"
          git push origin "${TAG_NAME}"
          gh release create "${TAG_NAME}" \
            --repo="$GITHUB_REPOSITORY" \
            --title="${IMAGE_NAME} ${TAG_NAME}" \
            --generate-notes
          echo "VERSION=${TAG_NAME}" >> "${GITHUB_ENV}"

      - id: gcp_auth
        name: Authenticate with GCP
        uses: google-github-actions/auth@v3.0.0
        with:
          token_format: access_token
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          workload_identity_provider: ${{ secrets.GCP_IDP }}

      - name: Log in to the container registry
        uses: docker/login-action@v4.5.1
        with:
          registry: ${{ secrets.GCP_LOCATION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.gcp_auth.outputs.access_token }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build container image
        id: push
        uses: docker/build-push-action@v7.3.0
        with:
          push: true
          build-args: XCADDY_VERSION=${{ env.XCADDY_VERSION }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME}}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
